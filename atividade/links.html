<!DOCTYPE html>
<html lang="en">
<head>
    <title>Formatando Links</title>
    <meta charset="UTF-8">
    <style type="text/css">
        a {
            padding: 5px 10px; /* aumentando o espaçamento da caixa background */
            text-decoration: none; /* retirando o underline do link */
        }
        /* Links não visitados */
        a:link { /* estado padrão de um link */
            color: #6bad1e;
        }
        a:visited { /* Links Visitados */
            color: #c0c0c0;
        }
        a:hover { /* Links Hover, ao passar o cursor sobre o link */
            color: #FFF;
            background: #bd9def; /* fundo com cor ao passar o mouse */
        }
        a:active { /* Links Ativos, quando segura o clique do mouse */
            color: #e43711; /* Cor corrigida (adicionado 1 dígito para completar o formato hexadecimal válido) */
        }
        /* Recomenda-se manter essa ordem de formatação */
    </style>
</head>
<body>
    <a href="https://www.google.com.br">
        Google
    </a> |
    <a href="https://www.tecmundo.com.br">
        Tec Mundo
    </a> |
    <a href="https://www.linknaovisitado.com.br">
        Link não visitado
    </a> |
    <a href="https://www.megacurioso.com.br">
        Mega Curioso
    </a>
</body>
</html>
